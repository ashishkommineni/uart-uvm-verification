name: RTL and SVA smoke
on: [push, pull_request]

permissions:
  contents: read
jobs:
  verilator-smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: {python-version: "3.12"}
      - run: pip install verilator==5.48.0
      - run: make lint VERILATOR=verilator-cli
      - run: make smoke VERILATOR=verilator-cli
