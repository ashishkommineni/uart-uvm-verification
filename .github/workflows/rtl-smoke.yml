name: RTL and SVA smoke
on: [push, pull_request]
jobs:
  verilator-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install verilator==5.48.0
      - run: make lint VERILATOR=verilator-cli
      - run: make smoke VERILATOR=verilator-cli
